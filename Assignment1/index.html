<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assignment 1</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Story creator</h1>

        <div id="subjectSection">
            <button id="subject">Change subject</button>
            <p class="sectionText" id="subjectText">Subject</p>
        </div>

        <div id="adverbSection">
            <button id="adverb">Change adverb</button>
            <p class="sectionText" id="adverbText">Adverb</p>
        </div>

        <div id="verbSection">
            <button id="verb">Change verb</button>
            <p class="sectionText" id="verbText">Verb</p>
        </div>

        <div id="adjectiveSection">
            <button id="adjective">Change adjective</button>
            <p class="sectionText" id="adjectiveText">Adjective</p>
        </div>


        <div id="objectSection">
            <button id="object">Change object</button>
            <p class="sectionText" id="objectText">Object</p>
        </div>

        <div id="locationSection">
            <button id="location">Change location</button>
            <p class="sectionText" id="locationText">Location</p>
        </div>
        
        <span id="storySection">
            <button id="storyButton">Create story</button>
            </br>
            <p id="storyText">The output will go here</p>
        </span>
